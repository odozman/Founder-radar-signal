services:
  - type: web
    name: founder-radar-signal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    disk:
      name: founder-radar-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: ALERT_TOKEN
        sync: false
      - key: POLL_HOURS
        value: "8"
      - key: BASELINE_ON_FIRST_RUN
        value: "true"
      - key: DATABASE_PATH
        value: "/var/data/state.db"
      - key: YC_DIRECTORY_URL
        value: "https://www.ycombinator.com/companies"
      - key: SPEEDRUN_URL
        value: "https://speedrun.a16z.com/companies"
